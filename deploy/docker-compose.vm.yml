services:
  oraculo-docker:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: oraculo-docker
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [oraculo-net]

  oraculo-db:
    image: pgvector/pgvector:pg17
    container_name: oraculo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oraculo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oraculo
    volumes:
      - oraculo-db-data:/var/lib/postgresql/data
    networks: [oraculo-net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oraculo -d oraculo']
      interval: 10s
      timeout: 5s
      retries: 5

  oraculo-api:
    build:
      context: ./app
    container_name: oraculo-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${HOME}/.local/bin/agy:/usr/local/bin/agy:ro
      - ${HOME}/.gemini:/root/.gemini
      - /usr/local/bin/claude:/usr/local/bin/claude:ro
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      - ${HOME}/.claude.json:/root/.claude.json:ro
      - ${HOME}/.claude/projects:/corpus/.claude/projects:ro
      - ${HOME}/claude-workspace-config:/corpus/claude-workspace-config:ro
      - ${HOME}/infra:/corpus/infra:ro
      - ${HOME}/projects:/corpus/projects:ro
      - ${HOME}/oraculo-workspace:/corpus/oraculo-workspace:ro
      - ${HOME}/oraculo-notas:/corpus/notas
      - oraculo-modelos:/app/.cache/transformers
      - /proc:/host/proc:ro
    networks: [oraculo-net, web]
    depends_on:
      oraculo-db:
        condition: service_healthy
      oraculo-docker:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.oraculo-api.rule=(Host(`icaromelodev.com.br`) || Host(`www.icaromelodev.com.br`)) && PathPrefix(`/oraculo-api`)
      - traefik.http.routers.oraculo-api.priority=200
      - traefik.http.routers.oraculo-api.entrypoints=websecure
      - traefik.http.routers.oraculo-api.tls.certresolver=le
      - traefik.http.routers.oraculo-api.middlewares=oraculo-api-strip
      - traefik.http.middlewares.oraculo-api-strip.stripprefix.prefixes=/oraculo-api
      - traefik.http.services.oraculo-api.loadbalancer.server.port=3000

volumes:
  oraculo-db-data:
  oraculo-modelos:

networks:
  web:
    external: true
  oraculo-net:
