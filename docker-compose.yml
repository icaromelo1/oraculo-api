services:
  oraculo-db:
    image: pgvector/pgvector:pg17
    container_name: oraculo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oraculo
      POSTGRES_PASSWORD: oraculo
      POSTGRES_DB: oraculo
    ports:
      - '5434:5432'
    volumes:
      - oraculo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oraculo -d oraculo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oraculo-db-data:
